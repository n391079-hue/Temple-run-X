<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Temple Run X</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #07130d;
    font-family: Arial, sans-serif;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
}

#ui {
    position: fixed;
    top: 12px;
    left: 12px;
    right: 12px;
    z-index: 5;
    color: white;
    pointer-events: none;
    text-shadow: 2px 2px 4px #000;
}

.row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
}

.box {
    background: rgba(0,0,0,.45);
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 12px;
    padding: 8px 12px;
    backdrop-filter: blur(4px);
}

#mission {
    margin-top: 8px;
    max-width: 330px;
}

#power {
    margin-top: 8px;
    display: none;
}

#menu, #gameover {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(rgba(0,0,0,.35), rgba(0,0,0,.75));
}

.panel {
    width: min(92%, 430px);
    padding: 28px;
    border-radius: 22px;
    text-align: center;
    color: white;
    background: rgba(8,20,13,.88);
    border: 2px solid rgba(255,205,80,.55);
    box-shadow: 0 15px 50px rgba(0,0,0,.6);
}

h1 {
    font-size: 42px;
    color: #ffd34d;
    margin-bottom: 8px;
}

h2 {
    margin-bottom: 15px;
}

.panel p {
    line-height: 1.5;
    color: #ddd;
    margin: 8px 0;
}

button {
    border: none;
    border-radius: 14px;
    padding: 14px 25px;
    margin-top: 18px;
    font-size: 18px;
    font-weight: bold;
    color: #17120a;
    background: linear-gradient(#ffe477,#f3a927);
    cursor: pointer;
    box-shadow: 0 5px 0 #9c6312;
}

button:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 #9c6312;
}

#gameover {
    display: none;
}

#controls {
    position: fixed;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    z-index: 6;
    display: flex;
    gap: 10px;
}

.ctrl {
    width: 58px;
    height: 58px;
    margin: 0;
    padding: 0;
    border-radius: 50%;
    background: rgba(255,255,255,.16);
    color: white;
    border: 1px solid rgba(255,255,255,.3);
    box-shadow: none;
    font-size: 24px;
    backdrop-filter: blur(5px);
}

#flash {
    position: fixed;
    inset: 0;
    z-index: 20;
    pointer-events: none;
    background: white;
    opacity: 0;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="ui">
    <div class="row">
        <div class="box">🏆 Score: <b id="score">0</b></div>
        <div class="box">🪙 Coins: <b id="coins">0</b></div>
        <div class="box">❤️ <b id="health">3</b></div>
        <div class="box">⭐ Level: <b id="level">1</b></div>
    </div>

    <div id="mission" class="box">
        🎯 Mission: Collect 10 coins
        <br>
        Progress: <b id="missionProgress">0/10</b>
    </div>

    <div id="power" class="box"></div>
</div>

<div id="menu">
    <div class="panel">
        <h1>TEMPLE RUN X</h1>
        <p>🏃 Run • Jump • Dodge • Collect</p>
        <p>⬅️ ➡️ Change lanes</p>
        <p>⬆️ Jump</p>
        <p>⬇️ Slide</p>
        <p>⚡ Collect power-ups and complete missions!</p>
        <button id="startBtn">START RUN</button>
    </div>
</div>

<div id="gameover">
    <div class="panel">
        <h1>RUN OVER</h1>
        <h2>💀 The temple got you!</h2>
        <p>Score: <b id="finalScore">0</b></p>
        <p>Coins: <b id="finalCoins">0</b></p>
        <p>Level: <b id="finalLevel">1</b></p>
        <button id="restartBtn">RUN AGAIN</button>
    </div>
</div>

<div id="controls">
    <button class="ctrl" id="leftBtn">◀</button>
    <button class="ctrl" id="jumpBtn">▲</button>
    <button class="ctrl" id="slideBtn">▼</button>
    <button class="ctrl" id="rightBtn">▶</button>
</div>

<div id="flash"></div>

<script>
"use strict";

/* =========================================================
   TEMPLE RUN X
   Single-file endless runner
   ========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;
let dpr = Math.min(window.devicePixelRatio || 1, 2);

function resize() {
    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener("resize", resize);
resize();

/* ---------------- GAME STATE ---------------- */

let running = false;
let gameTime = 0;
let score = 0;
let coins = 0;
let health = 3;
let level = 1;

let speed = 0.36;
let distance = 0;

let playerLane = 1;
let targetLane = 1;

let playerY = 0;
let velocityY = 0;

let sliding = false;
let slideTimer = 0;

let invincibleTimer = 0;
let magnetTimer = 0;
let shieldTimer = 0;
let boostTimer = 0;

let spawnTimer = 0;
let coinTimer = 0;
let powerTimer = 0;

let objects = [];

let missionTarget = 10;
let missionProgress = 0;
let missionIndex = 0;

const missions = [
    { type: "coins", target: 10, text: "Collect 10 coins" },
    { type: "score", target: 1500, text: "Reach 1500 score" },
    { type: "coins", target: 25, text: "Collect 25 coins" },
    { type: "score", target: 4000, text: "Reach 4000 score" },
    { type: "coins", target: 50, text: "Collect 50 coins" }
];

/* ---------------- PLAYER ---------------- */

const player = {
    width: 42,
    height: 68
};

/* ---------------- UTILITY ---------------- */

function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
}

function rand(min, max) {
    return Math.random() * (max - min) + min;
}

function randomLane() {
    return Math.floor(Math.random() * 3);
}

function roadY() {
    return H * 0.78;
}

function laneX(lane, z = 0) {
    /*
      z = 0 -> far away
      z = 1 -> player position
    */
    const farSpread = W * 0.09;
    const nearSpread = W * 0.31;

    const spread = farSpread + (nearSpread - farSpread) * z;

    return W / 2 + (lane - 1) * spread;
}

/* ---------------- UI ---------------- */

function updateUI() {
    document.getElementById("score").textContent = Math.floor(score);
    document.getElementById("coins").textContent = coins;
    document.getElementById("health").textContent = health;
    document.getElementById("level").textContent = level;

    const m = missions[missionIndex];

    if (m.type === "coins") {
        missionProgress = coins;
    } else {
        missionProgress = Math.floor(score);
    }

    document.getElementById("missionProgress").textContent =
        Math.min(missionProgress, m.target) + "/" + m.target;

    document.getElementById("mission").innerHTML =
        "🎯 Mission: " + m.text +
        "<br>Progress: <b>" +
        Math.min(missionProgress, m.target) +
        "/" + m.target + "</b>";

    const power = document.getElementById("power");

    let texts = [];

    if (magnetTimer > 0)
        texts.push("🧲 Magnet " + Math.ceil(magnetTimer) + "s");

    if (shieldTimer > 0)
        texts.push("🛡️ Shield " + Math.ceil(shieldTimer) + "s");

    if (boostTimer > 0)
        texts.push("⚡ Boost " + Math.ceil(boostTimer) + "s");

    if (invincibleTimer > 0)
        texts.push("✨ Invincible " + Math.ceil(invincibleTimer) + "s");

    if (texts.length) {
        power.style.display = "block";
        power.textContent = texts.join("  |  ");
    } else {
        power.style.display = "none";
    }
}

/* ---------------- START / END ---------------- */

function startGame() {
    running = true;

    gameTime = 0;
    score = 0;
    coins = 0;
    health = 3;
    level = 1;

    speed = 0.36;
    distance = 0;

    playerLane = 1;
    targetLane = 1;

    playerY = 0;
    velocityY = 0;

    sliding = false;
    slideTimer = 0;

    invincibleTimer = 0;
    magnetTimer = 0;
    shieldTimer = 0;
    boostTimer = 0;

    spawnTimer = 0;
    coinTimer = 0;
    powerTimer = 0;

    objects = [];

    missionIndex = 0;
    missionProgress = 0;

    document.getElementById("menu").style.display = "none";
    document.getElementById("gameover").style.display = "none";

    updateUI();
}

function gameOver() {
    running = false;

    document.getElementById("finalScore").textContent = Math.floor(score);
    document.getElementById("finalCoins").textContent = coins;
    document.getElementById("finalLevel").textContent = level;

    document.getElementById("gameover").style.display = "flex";
}

document.getElementById("startBtn").onclick = startGame;
document.getElementById("restartBtn").onclick = startGame;

/* ---------------- CONTROLS ---------------- */

function moveLeft() {
    if (!running) return;
    targetLane = clamp(targetLane - 1, 0, 2);
}

function moveRight() {
    if (!running) return;
    targetLane = clamp(targetLane + 1, 0, 2);
}

function jump() {
    if (!running) return;

    if (playerY <= 0.01) {
        velocityY = 1.15;
    }
}

function slide() {
    if (!running) return;

    sliding = true;
    slideTimer = 0.65;
}

document.getElementById("leftBtn").onclick = moveLeft;
document.getElementById("rightBtn").onclick = moveRight;
document.getElementById("jumpBtn").onclick = jump;
document.getElementById("slideBtn").onclick = slide;

window.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a")
        moveLeft();

    if (e.key === "ArrowRight" || e.key.toLowerCase() === "d")
        moveRight();

    if (e.key === "ArrowUp" || e.key === " ")
        jump();

    if (e.key === "ArrowDown" || e.key.toLowerCase() === "s")
        slide();

    if (e.key === "Enter" && !running)
        startGame();
});

/* ---------------- SWIPE ---------------- */

let touchStartX = 0;
let touchStartY = 0;

canvas.addEventListener("touchstart", e => {
    const t = e.changedTouches[0];

    touchStartX = t.clientX;
    touchStartY = t.clientY;
}, { passive: true });

canvas.addEventListener("touchend", e => {
    const t = e.changedTouches[0];

    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;

    if (Math.abs(dx) < 25 && Math.abs(dy) < 25) {
        jump();
        return;
    }

    if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 0)
            moveRight();
        else
            moveLeft();
    } else {
        if (dy < 0)
            jump();
        else
            slide();
    }
}, { passive: true });

/* ---------------- OBJECT SPAWNING ---------------- */

function spawnObstacle() {
    const lane = randomLane();

    const types = [
        "rock",
        "pillar",
        "log",
        "fire"
    ];

    const type = types[Math.floor(Math.random() * types.length)];

    objects.push({
        type,
        lane,
        z: 0,
        hit: false,
        passed: false
    });
}

function spawnCoinLine() {
    const lane = randomLane();

    for (let i = 0; i < 5; i++) {
        objects.push({
            type: "coin",
            lane: lane,
            z: -0.02 - i * 0.075,
            hit: false,
            passed: false
        });
    }
}

function spawnPower() {
    const lane = randomLane();

    const powers = [
        "magnet",
        "shield",
        "boost"
    ];

    objects.push({
        type: powers[Math.floor(Math.random() * powers.length)],
        lane,
        z: 0,
        hit: false,
        passed: false
    });
}

/* ---------------- UPDATE ---------------- */

function update(dt) {
    if (!running) return;

    gameTime += dt;
    distance += speed * dt;

    /* speed gradually increases */
    speed += dt * 0.004;

    if (boostTimer > 0) {
        boostTimer -= dt;
    }

    if (magnetTimer > 0) {
        magnetTimer -= dt;
    }

    if (shieldTimer > 0) {
        shieldTimer -= dt;
    }

    if (invincibleTimer > 0) {
        invincibleTimer -= dt;
    }

    if (slideTimer > 0) {
        slideTimer -= dt;

        if (slideTimer <= 0) {
            sliding = false;
        }
    }

    /* LEVEL SYSTEM */
    const newLevel = 1 + Math.floor(score / 1000);

    if (newLevel > level) {
        level = newLevel;

        flash();

        /*
          Every level makes the run faster.
        */
        speed += 0.025;
    }

    /* SCORE */
    score += dt * 100 * (boostTimer > 0 ? 2 : 1);

    /* LANE MOVEMENT */
    playerLane += (targetLane - playerLane) * Math.min(1, dt * 12);

    /* JUMP PHYSICS */
    velocityY -= 3.0 * dt;
    playerY += velocityY * dt;

    if (playerY < 0) {
        playerY = 0;
        velocityY = 0;
    }

    /* SPAWNING */
    spawnTimer -= dt;
    coinTimer -= dt;
    powerTimer -= dt;

    const obstacleInterval =
        Math.max(0.45, 1.05 - level * 0.025);

    if (spawnTimer <= 0) {
        spawnObstacle();
        spawnTimer = obstacleInterval * rand(0.75, 1.2);
    }

    if (coinTimer <= 0) {
        spawnCoinLine();
        coinTimer = rand(0.75, 1.25);
    }

    if (powerTimer <= 0) {
        spawnPower();
        powerTimer = rand(7, 11);
    }

    /* OBJECT MOVEMENT */
    let effectiveSpeed = speed;

    if (boostTimer > 0)
        effectiveSpeed *= 1.45;

    for (const o of objects) {
        o.z += effectiveSpeed * dt * 0.8;
    }

    /* COLLISIONS */
    for (const o of objects) {

        if (o.hit) continue;

        const laneDifference = Math.abs(o.lane - playerLane);

        /*
          Objects become collectible/hittable near player.
        */
        if (o.z > 0.77 && o.z < 1.02 && laneDifference < 0.42) {

            if (o.type === "coin") {

                o.hit = true;
                coins++;

                score += 50;

                checkMission();

                continue;
            }

            if (
                o.type === "magnet" ||
                o.type === "shield" ||
                o.type === "boost"
            ) {

                o.hit = true;

                activatePower(o.type);

                continue;
            }

            /* OBSTACLE */

            const jumpingHighEnough = playerY > 0.42;

            const slidingUnder = sliding &&
                (o.type === "pillar" || o.type === "rock");

            if (jumpingHighEnough || slidingUnder) {
                continue;
            }

            if (
                shieldTimer <= 0 &&
                invincibleTimer <= 0
            ) {
                o.hit = true;

                health--;

                invincibleTimer = 1.2;

                flash();

                if (health <= 0) {
                    gameOver();
                    return;
                }
            } else {
                o.hit = true;
            }
        }

        /* MAGNET COLLECTION */
        if (
            magnetTimer > 0 &&
            o.type === "coin" &&
            o.z > 0.45 &&
            o.z < 1.05
        ) {
            const diff = Math.abs(o.lane - playerLane);

            if (diff < 1.2) {
                o.hit = true;
                coins++;
                score += 50;
                checkMission();
            }
        }
    }

    /* REMOVE OLD OBJECTS */
    objects = objects.filter(o => o.z < 1.18);

    checkMission();
    updateUI();
}

/* ---------------- POWERS ---------------- */

function activatePower(type) {

    if (type === "magnet") {
        magnetTimer = 8;
    }

    if (type === "shield") {
        shieldTimer = 8;
    }

    if (type === "boost") {
        boostTimer = 7;
    }

    flash();
}

/* ---------------- MISSIONS ---------------- */

function checkMission() {

    const m = missions[missionIndex];

    let current = 0;

    if (m.type === "coins")
        current = coins;

    if (m.type === "score")
        current = score;

    if (current >= m.target) {

        score += 300;

        missionIndex++;

        if (missionIndex >= missions.length) {
            missionIndex = 0;
            missionTarget += 10;
        }

        flash();
    }
}

/* ---------------- DRAWING ---------------- */

function draw() {

    ctx.clearRect(0, 0, W, H);

    drawSky();
    drawTempleWorld();
    drawRoad();
    drawObjects();
    drawPlayer();
}

/* ---------------- SKY ---------------- */

function drawSky() {

    const g = ctx.createLinearGradient(0, 0, 0, H);

    g.addColorStop(0, "#071e2a");
    g.addColorStop(0.5, "#27636a");
    g.addColorStop(1, "#b28c55");

    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    /* moon/sun */
    ctx.beginPath();
    ctx.arc(W * 0.78, H * 0.18, 38, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,225,150,.8)";
    ctx.fill();

    /* mountains */
    ctx.fillStyle = "#163d36";

    ctx.beginPath();
    ctx.moveTo(0, H * .55);
    ctx.lineTo(W * .17, H * .32);
    ctx.lineTo(W * .3, H * .55);
    ctx.lineTo(W * .48, H * .29);
    ctx.lineTo(W * .7, H * .55);
    ctx.lineTo(W * .84, H * .34);
    ctx.lineTo(W, H * .54);
    ctx.lineTo(W, H);
    ctx.lineTo(0, H);
    ctx.closePath();
    ctx.fill();
}

/* ---------------- TEMPLE / TREES ---------------- */

function drawTempleWorld() {

    const horizon = H * 0.48;

    /* distant temple */
    ctx.fillStyle = "#55402a";

    ctx.fillRect(
        W * .41,
        horizon - 55,
        W * .18,
        70
    );

    ctx.fillStyle = "#6c5132";

    ctx.beginPath();
    ctx.moveTo(W * .37, horizon - 55);
    ctx.lineTo(W * .5, horizon - 105);
    ctx.lineTo(W * .63, horizon - 55);
    ctx.closePath();
    ctx.fill();

    /* temple columns */
    ctx.fillStyle = "#80623d";

    for (let i = 0; i < 4; i++) {
        ctx.fillRect(
            W * (.43 + i * .045),
            horizon - 45,
            12,
            60
        );
    }

    /* trees */
    for (let i = 0; i < 8; i++) {

        const side = i % 2 === 0 ? -1 : 1;

        const x =
            side < 0
                ? rand(20, W * .27)
                : rand(W * .73, W - 20);

        const y = rand(H * .43, H * .64);

        drawTree(x, y, rand(.55, 1.15));
    }
}

function drawTree(x, y, scale) {

    ctx.fillStyle = "#3b2817";

    ctx.fillRect(
        x - 7 * scale,
        y,
        14 * scale,
        70 * scale
    );

    ctx.fillStyle = "#174d2a";

    for (let i = 0; i < 3; i++) {
        ctx.beginPath();

        ctx.moveTo(
            x,
            y - 65 * scale + i * 25 * scale
        );

        ctx.lineTo(
            x - 38 * scale,
            y + 15 * scale + i * 18 * scale
        );

        ctx.lineTo(
            x + 38 * scale,
            y + 15 * scale + i * 18 * scale
        );

        ctx.closePath();
        ctx.fill();
    }
}

/* ---------------- ROAD ---------------- */

function drawRoad() {

    const horizon = H * 0.49;
    const bottom = H * 1.05;

    /* outer ground */
    ctx.fillStyle = "#3f5730";

    ctx.fillRect(
        0,
        horizon,
        W,
        H - horizon
    );

    /* road */
    ctx.fillStyle = "#493b2d";

    ctx.beginPath();

    ctx.moveTo(
        W * .48,
        horizon
    );

    ctx.lineTo(
        W * .52,
        horizon
    );

    ctx.lineTo(
        W * .94,
        bottom
    );

    ctx.lineTo(
        W * .06,
        bottom
    );

    ctx.closePath();
    ctx.fill();

    /* road borders */

    ctx.strokeStyle = "#a88755";
    ctx.lineWidth = 8;

    ctx.beginPath();
    ctx.moveTo(W * .48, horizon);
    ctx.lineTo(W * .06, bottom);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(W * .52, horizon);
    ctx.lineTo(W * .94, bottom);
    ctx.stroke();

    /* lane separators */
    ctx.strokeStyle = "rgba(210,185,130,.45)";
    ctx.lineWidth = 3;

    for (let lane = 1; lane < 3; lane++) {

        const xFar =
            lane === 1 ? W * .495 : W * .505;

        const xNear =
            lane === 1 ? W * .34 : W * .66;

        ctx.beginPath();

        ctx.moveTo(
            xFar,
            horizon
        );

        ctx.lineTo(
            xNear,
            bottom
        );

        ctx.stroke();
    }

    /* road stones */
    for (let i = 0; i < 12; i++) {

        const z =
            ((i / 12) + distance * .7) % 1;

        const y =
            horizon +
            Math.pow(z, 1.8) * (bottom - horizon);

        const size =
            2 + z * 7;

        const x =
            W / 2 +
            rand(-W * .35, W * .35) * z;

        ctx.fillStyle = "rgba(210,190,150,.35)";

        ctx.beginPath();
        ctx.arc(x, y, size, 0, Math.PI * 2);
        ctx.fill();
    }
}

/* ---------------- OBJECTS ---------------- */

function drawObjects() {

    /*
      Draw far objects first.
    */
    const sorted = [...objects].sort((a,b) => a.z - b.z);

    for (const o of sorted) {

        if (o.z < -0.2) continue;

        const z = clamp(o.z, 0, 1);

        const x = laneX(o.lane, z);

        const y =
            H * .49 +
            Math.pow(z, 1.65) * (H * .78 - H * .49);

        const scale = .15 + z * 1.05;

        if (o.type === "coin")
            drawCoin(x, y, scale);

        else if (o.type === "rock")
            drawRock(x, y, scale);

        else if (o.type === "pillar")
            drawPillar(x, y, scale);

        else if (o.type === "log")
            drawLog(x, y, scale);

        else if (o.type === "fire")
            drawFire(x, y, scale);

        else
            drawPower(o.type, x, y, scale);
    }
}

function drawCoin(x, y, s) {

    const r = 11 * s;

    ctx.save();

    ctx.translate(x, y);

    ctx.rotate(gameTime * 4);

    ctx.fillStyle = "#ffd83d";

    ctx.beginPath();
    ctx.ellipse(0, 0, r * .72, r, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "#fff1a1";
    ctx.lineWidth = Math.max(1, 2*s);
    ctx.stroke();

    ctx.fillStyle = "#9c6b16";
    ctx.font = `${Math.max(8, 14*s)}px Arial`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("$", 0, 1);

    ctx.restore();
}

function drawRock(x, y, s) {

    const w = 40 * s;
    const h = 30 * s;

    ctx.fillStyle = "#5d5b55";

    ctx.beginPath();
    ctx.moveTo(x - w/2, y);
    ctx.lineTo(x - w*.3, y-h);
    ctx.lineTo(x + w*.25, y-h*1.1);
    ctx.lineTo(x + w/2, y);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#77736a";

    ctx.beginPath();
    ctx.moveTo(x-w*.3, y-h);
    ctx.lineTo(x, y-h*.65);
    ctx.lineTo(x+w*.25, y-h*1.1);
    ctx.closePath();
    ctx.fill();
}

function drawPillar(x, y, s) {

    const w = 28*s;
    const h = 75*s;

    ctx.fillStyle = "#806546";

    ctx.fillRect(
        x-w/2,
        y-h,
        w,
        h
    );

    ctx.fillStyle = "#a48860";

    ctx.fillRect(
        x-w*.7,
        y-h-7*s,
        w*1.4,
        9*s
    );

    ctx.fillRect(
        x-w*.7,
        y-4*s,
        w*1.4,
        8*s
    );
}

function drawLog(x, y, s) {

    const w = 65*s;

    ctx.save();

    ctx.translate(x,y);
    ctx.rotate(-0.15);

    ctx.fillStyle = "#663b1e";

    ctx.fillRect(
        -w/2,
        -16*s,
        w,
        30*s
    );

    ctx.fillStyle = "#a36a34";

    ctx.beginPath();
    ctx.arc(
        -w/2,
        -1*s,
        15*s,
        0,
        Math.PI*2
    );
    ctx.fill();

    ctx.restore();
}

function drawFire(x, y, s) {

    const r = 30*s;

    ctx.fillStyle = "#f44";

    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.quadraticCurveTo(
        x-r,
        y-r*.2,
        x-r*.45,
        y-r
    );
    ctx.quadraticCurveTo(
        x,
        y-r*.45,
        x+r*.25,
        y-r*1.1
    );
    ctx.quadraticCurveTo(
        x+r,
        y-r*.25,
        x,
        y
    );
    ctx.fill();

    ctx.fillStyle = "#ffd83d";

    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.quadraticCurveTo(
        x-r*.55,
        y-r*.15,
        x-r*.18,
        y-r*.65
    );
    ctx.quadraticCurveTo(
        x,
        y-r*.3,
        x+r*.18,
        y-r*.72
    );
    ctx.quadraticCurveTo(
        x+r*.5,
        y-r*.15,
        x,
        y
    );
    ctx.fill();
}

function drawPower(type, x, y, s) {

    const r = 20*s;

    ctx.save();

    ctx.translate(x,y);

    if (type === "magnet") {
        ctx.strokeStyle = "#ff4a5f";
        ctx.lineWidth = 8*s;

        ctx.beginPath();
        ctx.arc(0,0,r*.8,0,Math.PI);
        ctx.stroke();

        ctx.fillStyle = "#fff";
        ctx.font = `${18*s}px Arial`;
        ctx.textAlign = "center";
        ctx.fillText("M",0,5*s);
    }

    if (type === "shield") {
        ctx.fillStyle = "#42a5ff";

        ctx.beginPath();
        ctx.moveTo(0,-r);
        ctx.lineTo(r*.8,-r*.35);
        ctx.lineTo(r*.55,r*.7);
        ctx.lineTo(0,r);
        ctx.lineTo(-r*.55,r*.7);
        ctx.lineTo(-r*.8,-r*.35);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = "#fff";
        ctx.font = `${16*s}px Arial`;
        ctx.textAlign = "center";
        ctx.fillText("★",0,5*s);
    }

    if (type === "boost") {
        ctx.fillStyle = "#ffe23d";

        ctx.beginPath();
        ctx.moveTo(r*.1,-r);
        ctx.lineTo(-r*.65,r*.05);
        ctx.lineTo(-r*.05,r*.05);
        ctx.lineTo(-r*.3,r);
        ctx.lineTo(r*.7,-r*.25);
        ctx.lineTo(r*.1,-r*.25);
        ctx.closePath();
        ctx.fill();
    }

    ctx.restore();
}

/* ---------------- PLAYER ---------------- */

function drawPlayer() {

    const x =
        laneX(playerLane, 1);

    const baseY =
        roadY() - playerY * H * .23;

    const bob =
        playerY === 0
            ? Math.sin(gameTime * 14) * 3
            : 0;

    const y = baseY + bob;

    let h = player.height;

    if (sliding)
        h *= .62;

    /*
      Shadow
    */
    ctx.fillStyle = "rgba(0,0,0,.35)";

    ctx.beginPath();
    ctx.ellipse(
        x,
        roadY()+5,
        sliding ? 30 : 23,
        8,
        0,
        0,
        Math.PI*2
    );
    ctx.fill();

    /*
      Shield visual
    */
    if (shieldTimer > 0) {

        ctx.strokeStyle = "rgba(80,180,255,.75)";
        ctx.lineWidth = 4;

        ctx.beginPath();
        ctx.arc(
            x,
            y-h*.48,
            45,
            0,
            Math.PI*2
        );
        ctx.stroke();
    }

    /*
      Body
    */
    ctx.fillStyle = "#24394a";

    if (!sliding) {
        roundRect(
            x-16,
            y-58,
            32,
            38,
            7
        );
        ctx.fill();
    } else {
        roundRect(
            x-28,
            y-40,
            55,
            25,
            8
        );
        ctx.fill();
    }

    /*
      Head
    */
    ctx.fillStyle = "#c58d65";

    ctx.beginPath();
    ctx.arc(
        x,
        y-72,
        15,
        0,
        Math.PI*2
    );
    ctx.fill();

    /*
      Hair
    */
    ctx.fillStyle = "#231b16";

    ctx.beginPath();
    ctx.arc(
        x,
        y-77,
        15,
        Math.PI,
        Math.PI*2
    );
    ctx.fill();

    /*
      Eyes
    */
    ctx.fillStyle = "#111";

    ctx.beginPath();
    ctx.arc(x-5,y-71,2,0,Math.PI*2);
    ctx.arc(x+5,y-71,2,0,Math.PI*2);
    ctx.fill();

    /*
      Arms
    */
    if (!sliding) {

        ctx.strokeStyle = "#c58d65";
        ctx.lineWidth = 7;
        ctx.lineCap = "round";

        const swing =
            Math.sin(gameTime * 14) * 12;

        ctx.beginPath();
        ctx.moveTo(x-12,y-50);
        ctx.lineTo(x-27,y-35+swing);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(x+12,y-50);
        ctx.lineTo(x+27,y-35-swing);
        ctx.stroke();
    }

    /*
      Legs
    */
    if (!sliding) {

        ctx.strokeStyle = "#182532";
        ctx.lineWidth = 9;

        const swing =
            Math.sin(gameTime * 14) * 14;

        ctx.beginPath();
        ctx.moveTo(x-8,y-20);
        ctx.lineTo(x-14,y+swing);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(x+8,y-20);
        ctx.lineTo(x+14,y-swing);
        ctx.stroke();
    }

    /*
      Shoes
    */
    ctx.fillStyle = "#151515";

    if (!sliding) {

        ctx.fillRect(
            x-22,
            y+5,
            16,
            7
        );

        ctx.fillRect(
            x+6,
            y+5,
            16,
            7
        );
    }

    /*
      Boost effect
    */
    if (boostTimer > 0) {

        ctx.strokeStyle = "rgba(255,220,50,.75)";
        ctx.lineWidth = 3;

        for (let i=0;i<5;i++) {

            const yy =
                y-30 + i*10;

            ctx.beginPath();
            ctx.moveTo(
                x-30-i*3,
                yy
            );
            ctx.lineTo(
                x-60-i*6,
                yy
            );
            ctx.stroke();
        }
    }
}

function roundRect(x,y,w,h,r) {

    ctx.beginPath();

    ctx.moveTo(x+r,y);
    ctx.lineTo(x+w-r,y);

    ctx.quadraticCurveTo(
        x+w,y,
        x+w,y+r
    );

    ctx.lineTo(x+w,y+h-r);

    ctx.quadraticCurveTo(
        x+w,y+h,
        x+w-r,y+h
    );

    ctx.lineTo(x+r,y+h);

    ctx.quadraticCurveTo(
        x,y+h,
        x,y+h-r
    );

    ctx.lineTo(x,y+r);

    ctx.quadraticCurveTo(
        x,y,
        x+r,y
    );

    ctx.closePath();
}

/* ---------------- FLASH ---------------- */

let flashTimer = 0;

function flash() {
    flashTimer = 0.15;
}

function updateFlash(dt) {

    if (flashTimer > 0) {

        flashTimer -= dt;

        const opacity =
            Math.max(0, flashTimer / .15) * .35;

        document.getElementById("flash").style.opacity =
            opacity;
    }
}

/* ---------------- GAME LOOP ---------------- */

let lastTime = performance.now();

function loop(now) {

    const dt =
        Math.min(0.033, (now-lastTime)/1000);

    lastTime = now;

    update(dt);
    updateFlash(dt);
    draw();

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

/* ---------------- INITIAL UI ---------------- */

updateUI();

</script>
